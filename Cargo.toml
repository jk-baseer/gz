[workspace]
members = [
    "crates/openrtb",
    "crates/common",
    "crates/bidder",
    "crates/campaign-api",
    "crates/optimizer",
    "crates/pacing",
    "crates/reporting",
    "crates/event-consumer",
    "crates/publisher-tag",
]
resolver = "2"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP framework
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors", "compression-gzip"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "uuid", "chrono"] }

# Cache
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# IDs and time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Concurrency
dashmap = "5"

# Config
config = "0.14"
dotenvy = "0.15"
base64 = "0.22"
jsonwebtoken = "9"
argon2 = "0.5"
rand = "0.8"
rand_distr = "0.4"

# Internal crates
openrtb = { path = "crates/openrtb" }
common = { path = "crates/common" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
