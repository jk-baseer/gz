name: Deploy

on:
  push:
    branches: [main]

# Only one deploy runs at a time; queued runs cancel each other
concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # e.g. ghcr.io/your-github-org
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  # ── 1. Build & push all service images ────────────────────────────────────
  build:
    name: Build images
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write   # needed to push to ghcr.io

    strategy:
      matrix:
        service:
          - { bin: bidder,         tag: gz-bidder   }
          - { bin: campaign-api,   tag: gz-api       }
          - { bin: pacing,         tag: gz-pacing    }
          - { bin: event-consumer, tag: gz-events    }

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service.bin }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: BIN=${{ matrix.service.bin }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service.tag }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service.tag }}:${{ github.sha }}
          # Layer cache stored in the registry — keeps rebuilds fast
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/${{ matrix.service.tag }}:cache
          cache-to:   type=registry,ref=${{ env.IMAGE_PREFIX }}/${{ matrix.service.tag }}:cache,mode=max

  # ── 2. Deploy to server ────────────────────────────────────────────────────
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: build   # wait for all images to be pushed

    environment: production   # optional: require manual approval in GitHub UI

    steps:
      - uses: actions/checkout@v4

      - name: Write .env to server and restart services
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          GIT_SHA: ${{ github.sha }}
          # ── Secrets you add in GitHub → Settings → Secrets ────────────────
          POSTGRES_PASSWORD:      ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD:         ${{ secrets.REDIS_PASSWORD }}
          JWT_SECRET:             ${{ secrets.JWT_SECRET }}
          BID_DOMAIN:             ${{ secrets.BID_DOMAIN }}
          APP_DOMAIN:             ${{ secrets.APP_DOMAIN }}
          STRIPE_SECRET_KEY:      ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET:  ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          LOG_LEVEL:              ${{ vars.LOG_LEVEL }}
        with:
          host:        ${{ secrets.DEPLOY_HOST }}
          username:    ${{ secrets.DEPLOY_USER }}
          key:         ${{ secrets.DEPLOY_SSH_KEY }}
          envs:        IMAGE_PREFIX,GIT_SHA,POSTGRES_PASSWORD,REDIS_PASSWORD,JWT_SECRET,BID_DOMAIN,APP_DOMAIN,STRIPE_SECRET_KEY,STRIPE_WEBHOOK_SECRET,LOG_LEVEL
          script: |
            set -e
            cd /opt/gz

            # Pull latest code (nginx config, compose file, etc.)
            git fetch --quiet origin main
            git reset --hard origin/main

            # Write the .env that docker-compose reads
            cat > docker/.env <<EOF
            POSTGRES_USER=gz
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            POSTGRES_DB=gz_ads
            REDIS_PASSWORD=${REDIS_PASSWORD}
            JWT_SECRET=${JWT_SECRET}
            BID_DOMAIN=${BID_DOMAIN}
            APP_DOMAIN=${APP_DOMAIN}
            STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
            STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
            CLICKHOUSE_DB=gz
            LOG_LEVEL=${LOG_LEVEL:-info}
            IMAGE_PREFIX=${IMAGE_PREFIX}
            EOF

            # Log in to ghcr.io on the server (uses a read-only deploy token)
            echo "${{ secrets.GHCR_PULL_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull the exact images built from this commit
            docker compose -f docker/docker-compose.prod.yml pull \
              bidder campaign-api pacing event-consumer

            # Rolling restart: databases and proxy never go down
            docker compose -f docker/docker-compose.prod.yml up -d \
              --no-build \
              --remove-orphans

            # Run any new migrations (idempotent)
            docker compose -f docker/docker-compose.prod.yml run --rm \
              campaign-api /usr/local/bin/migrate || true

            # Brief smoke-check
            sleep 5
            docker compose -f docker/docker-compose.prod.yml ps | grep -E "Up|running"

            echo "Deploy of ${GIT_SHA} complete"
