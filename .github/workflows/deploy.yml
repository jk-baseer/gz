name: Deploy

on:
  push:
    branches: [main]

# Only one deploy runs at a time; queued runs cancel each other
concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  # ── 1. Tests (must pass before anything else) ──────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gz
          POSTGRES_PASSWORD: gz
          POSTGRES_DB: gz_ads
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://gz:gz@localhost:5432/gz_ads
      REDIS_URL: redis://localhost:6379
      PUBLIC_HOSTNAME: localhost:8080
      JWT_SECRET: ci-test-secret
      CLICKHOUSE_URL: http://localhost:8123
      CLICKHOUSE_DB: gz

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all

  # ── 2. Build & push images (parallel per service) ─────────────────────────
  build:
    name: Build ${{ matrix.service.bin }}
    runs-on: ubuntu-latest
    needs: test   # don't build if tests fail

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - { bin: bidder,         tag: gz-bidder  }
          - { bin: campaign-api,   tag: gz-api      }
          - { bin: pacing,         tag: gz-pacing   }
          - { bin: event-consumer, tag: gz-events   }

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: BIN=${{ matrix.service.bin }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service.tag }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service.tag }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/${{ matrix.service.tag }}:cache
          cache-to:   type=registry,ref=${{ env.IMAGE_PREFIX }}/${{ matrix.service.tag }}:cache,mode=max

  # ── 3. Deploy to server ────────────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build   # all four images must be pushed first

    # Remove the 'environment: production' line if you don't want manual approval
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: appleboy/ssh-action@v1
        env:
          IMAGE_PREFIX:           ${{ env.IMAGE_PREFIX }}
          GIT_SHA:                ${{ github.sha }}
          POSTGRES_PASSWORD:      ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD:         ${{ secrets.REDIS_PASSWORD }}
          JWT_SECRET:             ${{ secrets.JWT_SECRET }}
          BID_DOMAIN:             ${{ secrets.BID_DOMAIN }}
          APP_DOMAIN:             ${{ secrets.APP_DOMAIN }}
          STRIPE_SECRET_KEY:      ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET:  ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          LOG_LEVEL:              ${{ vars.LOG_LEVEL }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          envs:     IMAGE_PREFIX,GIT_SHA,POSTGRES_PASSWORD,REDIS_PASSWORD,JWT_SECRET,BID_DOMAIN,APP_DOMAIN,STRIPE_SECRET_KEY,STRIPE_WEBHOOK_SECRET,LOG_LEVEL,CLOUDFLARE_TUNNEL_TOKEN
          script: |
            set -e
            cd /opt/gz

            git fetch --quiet origin main
            git reset --hard origin/main

            cat > docker/.env <<EOF
            POSTGRES_USER=gz
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            POSTGRES_DB=gz_ads
            REDIS_PASSWORD=${REDIS_PASSWORD}
            JWT_SECRET=${JWT_SECRET}
            BID_DOMAIN=${BID_DOMAIN}
            APP_DOMAIN=${APP_DOMAIN}
            PUBLIC_HOSTNAME=${BID_DOMAIN}
            STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
            STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
            CLICKHOUSE_DB=gz
            LOG_LEVEL=${LOG_LEVEL:-info}
            IMAGE_PREFIX=${IMAGE_PREFIX}
            CLOUDFLARE_TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
            EOF

            echo "${{ secrets.GHCR_PULL_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker compose -f docker/docker-compose.prod.yml pull \
              bidder campaign-api pacing event-consumer

            docker compose -f docker/docker-compose.prod.yml up -d \
              --no-build --remove-orphans

            sleep 5
            docker compose -f docker/docker-compose.prod.yml ps --format "table {{.Name}}\t{{.Status}}"
            echo "Deployed ${GIT_SHA}"
