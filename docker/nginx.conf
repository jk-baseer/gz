# nginx reverse proxy for GZ Ads
# Replace GZ_BID_DOMAIN and GZ_API_DOMAIN with your real domains.
# SSL certificates are managed by certbot (see docker-compose.prod.yml).

# ── Redirect HTTP → HTTPS ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    # Let certbot answer ACME challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Bidder (exchange-facing) ──────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name bid.gz-ads.com;   # ← change to your domain

    ssl_certificate     /etc/letsencrypt/live/bid.gz-ads.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bid.gz-ads.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # Exchanges set a 100-150ms timeout; upstream must be fast
    proxy_read_timeout  200ms;
    proxy_connect_timeout 50ms;

    location / {
        proxy_pass         http://bidder:8080;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# ── Campaign API + Dashboard (advertiser-facing) ──────────────────────────────
server {
    listen 443 ssl http2;
    server_name app.gz-ads.com;   # ← change to your domain

    ssl_certificate     /etc/letsencrypt/live/app.gz-ads.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.gz-ads.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # Gzip for dashboard assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    location / {
        proxy_pass         http://campaign-api:8081;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
